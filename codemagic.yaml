workflows:
  android-build:
    name: Android APK Build
    max_build_duration: 60
    environment:
      flutter: 3.41.5
      vars:
        APP_NAME: FIMCOS
        APP_PACKAGE_NAME: com.fimcos.financneindexy
    scripts:
      - name: Najdi Flutter projekt
        script: |
          if [ -f "financne_indexy/pubspec.yaml" ] && [ -f "financne_indexy/lib/main.dart" ]; then
            PROJECT_DIR="financne_indexy"
          elif [ -f "APK/financne_indexy/pubspec.yaml" ] && [ -f "APK/financne_indexy/lib/main.dart" ]; then
            PROJECT_DIR="APK/financne_indexy"
          else
            echo "Flutter projekt sa nenasiel."
            echo "Ocakavane umiestnenie:"
            echo "  financne_indexy/pubspec.yaml"
            echo "  financne_indexy/lib/main.dart"
            echo "Aktualny obsah repozitara:"
            pwd
            find . -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $CM_ENV

      - name: Vygeneruj Android projekt
        script: |
          cd "$PROJECT_DIR"
          mkdir -p /tmp/financne_indexy_backup
          cp pubspec.yaml /tmp/financne_indexy_backup/pubspec.yaml
          cp lib/main.dart /tmp/financne_indexy_backup/main.dart

          rm -rf android ios linux macos web windows test .dart_tool

          flutter create --platforms=android --org com.fimcos --project-name financne_indexy .

          cp /tmp/financne_indexy_backup/pubspec.yaml pubspec.yaml
          cp /tmp/financne_indexy_backup/main.dart lib/main.dart

      - name: Nastav Android identitu
        script: |
          cd "$PROJECT_DIR"
          if [ -f android/app/build.gradle.kts ]; then
            perl -0pi -e 's|namespace = "[^"]*"|namespace = "'"$APP_PACKAGE_NAME"'"|' android/app/build.gradle.kts
            perl -0pi -e 's|applicationId = "[^"]*"|applicationId = "'"$APP_PACKAGE_NAME"'"|' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            perl -0pi -e "s|namespace ['\"][^'\"]*['\"]|namespace '$APP_PACKAGE_NAME'|" android/app/build.gradle
            perl -0pi -e "s|applicationId ['\"][^'\"]*['\"]|applicationId '$APP_PACKAGE_NAME'|" android/app/build.gradle
          else
            echo "Android app Gradle subor sa nenasiel."
            find android -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "===== Android package name ====="
          echo "$APP_PACKAGE_NAME"

      - name: Nastav nazov aplikacie
        script: |
          cd "$PROJECT_DIR"
          mkdir -p android/app/src/main/res/values
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            if grep -q '<string name="app_name">' android/app/src/main/res/values/strings.xml; then
              perl -0pi -e 's|<string name="app_name">.*?</string>|<string name="app_name">'"$APP_NAME"'</string>|' android/app/src/main/res/values/strings.xml
            else
              perl -0pi -e 's|</resources>|    <string name="app_name">'"$APP_NAME"'</string>\n</resources>|' android/app/src/main/res/values/strings.xml
            fi
          else
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              "    <string name=\"app_name\">$APP_NAME</string>" \
              '</resources>' > android/app/src/main/res/values/strings.xml
          fi

          if grep -q 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml; then
            echo "Android label uz pouziva @string/app_name"
          else
            perl -0pi -e 's|android:label="[^"]*"|android:label="@string/app_name"|' android/app/src/main/AndroidManifest.xml
          fi

          echo "===== android/app/src/main/res/values/strings.xml ====="
          cat android/app/src/main/res/values/strings.xml

      - name: Pridaj Android permissions
        script: |
          cd "$PROJECT_DIR"
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            perl -0pi -e 's|<manifest[^>]*>|$&\n    <uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml; then
            perl -0pi -e 's|<manifest[^>]*>|$&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' android/app/src/main/AndroidManifest.xml
          fi

      - name: Zapni Android desugaring
        script: |
          cd "$PROJECT_DIR"
          if [ -f android/app/build.gradle.kts ]; then
            if ! grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts; then
              perl -0pi -e 's|compileOptions\s*\{\s*|compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n|' android/app/build.gradle.kts
            fi
            if grep -q 'dependencies\s*{' android/app/build.gradle.kts; then
              if ! grep -q 'desugar_jdk_libs' android/app/build.gradle.kts; then
                perl -0pi -e 's|dependencies\s*\{\s*|dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n|' android/app/build.gradle.kts
              fi
            else
              printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
            fi
          elif [ -f android/app/build.gradle ]; then
            if ! grep -q 'coreLibraryDesugaringEnabled true' android/app/build.gradle; then
              perl -0pi -e 's|compileOptions\s*\{\s*|compileOptions {\n        coreLibraryDesugaringEnabled true\n|' android/app/build.gradle
            fi
            if grep -q 'dependencies\s*{' android/app/build.gradle; then
              if ! grep -q 'desugar_jdk_libs' android/app/build.gradle; then
                perl -0pi -e "s|dependencies\\s*\\{\\s*|dependencies {\\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\\n|" android/app/build.gradle
              fi
            else
              printf "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n" >> android/app/build.gradle
            fi
          else
            echo "Android app Gradle subor sa nenasiel."
            find android -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "===== android/app/build.gradle(.kts) po uprave ====="
          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          else
            cat android/app/build.gradle
          fi

      - name: Nastav release signing
        script: |
          cd "$PROJECT_DIR"
          if [ -z "$CM_KEYSTORE_BASE64" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_PASSWORD" ]; then
            echo "Chybaju Codemagic secrety pre stabilny Android release signing."
            echo "Pozadovane secrety: CM_KEYSTORE_BASE64, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD"
            exit 1
          fi

          printf '%s' "$CM_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          echo "CM_RELEASE_KEYSTORE_PATH=$PROJECT_DIR/android/release-keystore.jks" >> $CM_ENV

          if [ -f android/app/build.gradle.kts ]; then
            if ! grep -q 'CM_RELEASE_KEYSTORE_PATH' android/app/build.gradle.kts; then
              printf '\nval cmReleaseKeystorePath = System.getenv("CM_RELEASE_KEYSTORE_PATH")\nval cmReleaseStorePassword = System.getenv("CM_KEYSTORE_PASSWORD")\nval cmReleaseKeyAlias = System.getenv("CM_KEY_ALIAS")\nval cmReleaseKeyPassword = System.getenv("CM_KEY_PASSWORD")\n\nandroid {\n    signingConfigs {\n        create("release") {\n            storeFile = file(cmReleaseKeystorePath!!)\n            storePassword = cmReleaseStorePassword\n            keyAlias = cmReleaseKeyAlias\n            keyPassword = cmReleaseKeyPassword\n        }\n    }\n    buildTypes {\n        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n        }\n    }\n}\n' >> android/app/build.gradle.kts
            fi
          elif [ -f android/app/build.gradle ]; then
            if ! grep -q 'CM_RELEASE_KEYSTORE_PATH' android/app/build.gradle; then
              printf "\ndef cmReleaseKeystorePath = System.getenv('CM_RELEASE_KEYSTORE_PATH')\ndef cmReleaseStorePassword = System.getenv('CM_KEYSTORE_PASSWORD')\ndef cmReleaseKeyAlias = System.getenv('CM_KEY_ALIAS')\ndef cmReleaseKeyPassword = System.getenv('CM_KEY_PASSWORD')\n\nandroid {\n    signingConfigs {\n        release {\n            storeFile file(cmReleaseKeystorePath)\n            storePassword cmReleaseStorePassword\n            keyAlias cmReleaseKeyAlias\n            keyPassword cmReleaseKeyPassword\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\n" >> android/app/build.gradle
            fi
          else
            echo "Android app Gradle subor sa nenasiel."
            find android -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Stiahni zavislosti
        script: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Zostav release APK
        script: |
          cd "$PROJECT_DIR"
          flutter build apk --release

    artifacts:
      - financne_indexy/build/app/outputs/flutter-apk/app-release.apk
      - APK/financne_indexy/build/app/outputs/flutter-apk/app-release.apk
